<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocho Vago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a0a2e 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .rotating-image {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #ff0000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 80px rgba(255, 0, 0, 0.3);
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .text-overlay h1 {
            color: #ff0000;
            font-size: 2.5rem;
            text-shadow: 
                3px 3px 0 #8b0000,
                -1px -1px 0 #8b0000,
                1px -1px 0 #8b0000,
                -1px 1px 0 #8b0000,
                0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 2px;
            line-height: 1.3;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .question-section {
            text-align: center;
            z-index: 10;
        }

        .question-section h2 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-yes {
            background: linear-gradient(135deg, #00ff00, #00cc00);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8);
        }

        .btn-no {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .btn-no:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
        }

        .circus-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .light {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 0.3;
                box-shadow: 0 0 10px currentColor;
            }
            to {
                opacity: 1;
                box-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
            }
        }

        /* Video overlay */
        .video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
        }

        .video-overlay.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="circus-lights" id="lights"></div>
    
    <div class="container">
        <img src="imagen.jpeg" alt="Imagen" class="rotating-image">
        <div class="text-overlay">
            <h1>Mocho vago,<br>agarra la pala</h1>
        </div>
    </div>

    <div class="question-section">
        <h2>¿Quieres chamba?</h2>
        <div class="buttons">
            <button class="btn btn-yes" onclick="goToLinkedIn()">Sí</button>
            <button class="btn btn-no" onclick="showVideo()">No</button>
        </div>
    </div>

    <!-- Video overlay para la respuesta "No" -->
    <div class="video-overlay" id="videoOverlay">
        <video id="noVideo" autoplay>
            <source src="video_no.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Música de fondo local -->
    <audio id="bgMusic" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Crear luces de circo
        const lightsContainer = document.getElementById('lights');
        const colors = ['#ff0000', '#ffff00', '#00ff00', '#0000ff', '#ff00ff', '#00ffff'];
        
        for (let i = 0; i < 30; i++) {
            const light = document.createElement('div');
            light.className = 'light';
            light.style.left = Math.random() * 100 + '%';
            light.style.top = Math.random() * 100 + '%';
            light.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            light.style.color = colors[Math.floor(Math.random() * colors.length)];
            light.style.animationDelay = Math.random() * 2 + 's';
            lightsContainer.appendChild(light);
        }

        // Música de fondo
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.7;
        
        // Intentar reproducción automática
        bgMusic.play().catch(() => {
            // Si falla, reproducir al primer clic
            document.body.addEventListener('click', () => {
                bgMusic.play().catch(e => console.log('Audio bloqueado:', e));
            }, { once: true });
        });

        // Función para ir a LinkedIn
        function goToLinkedIn() {
            window.open('https://www.linkedin.com', '_blank');
        }

        // Función para mostrar el video en pantalla completa
        function showVideo() {
            const overlay = document.getElementById('videoOverlay');
            const video = document.getElementById('noVideo');
            
            overlay.classList.add('active');
            video.currentTime = 0;
            video.play().catch(e => console.log('Video bloqueado:', e));
            
            // Cuando termine el video, cerrar la pestaña
            video.onended = function() {
                // Intentar cerrar la ventana/pestaña
                window.close();
                
                // Si no se pudo cerrar (porque no fue abierta por JS), 
                // intentar redirigir a about:blank como alternativa
                setTimeout(() => {
                    window.location.href = 'about:blank';
                }, 100);
            };
        }

        // Cerrar con Escape también
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('videoOverlay').classList.remove('active');
                const video = document.getElementById('noVideo');
                video.pause();
            }
        });
    </script>
</body>
</html>
