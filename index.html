<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocho Vago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        /* Fondo de palas */
        .shovel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            background-image: url("pala.png");
            background-size: 80px 80px;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            z-index: 10;
        }

        .rotating-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 3px solid #ff0000;
            animation: rotate 12s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .text-overlay h1 {
            color: #ff0000;
            font-size: 1.8rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .question-section {
            text-align: center;
            z-index: 10;
        }

        .question-section h2 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 25px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-yes {
            border-color: #00ff00;
            color: #00ff00;
        }

        .btn-yes:hover {
            background: #00ff00;
            color: #000;
        }

        .btn-no {
            border-color: #ff0000;
            color: #ff0000;
            position: relative;
            transition: all 0.3s ease;
        }

        .btn-no:hover {
            background: #ff0000;
            color: #fff;
        }

        .btn-no.escaping {
            position: fixed;
            z-index: 100;
        }

        /* Video overlay */
        .video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
        }

        .video-overlay.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        audio {
            display: none;
        }

        /* Overlay de inicio */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
        }

        .start-overlay h2 {
            color: #fff;
            font-size: 2rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .start-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Overlay de inicio -->
    <div class="start-overlay" id="startOverlay">
        <h2>CLIC PARA ENTRAR</h2>
    </div>

    <!-- Fondo de palas -->
    <div class="shovel-bg" id="shovelBg"></div>
    
    <div class="container">
        <img src="imagen.jpeg" alt="Imagen" class="rotating-image">
        <div class="text-overlay">
            <h1>Mocho vago,<br>agarra la pala</h1>
        </div>
    </div>

    <div class="question-section">
        <h2>¿Quieres chamba?</h2>
        <div class="buttons">
            <button class="btn btn-yes" onclick="goToLinkedIn()">Sí</button>
            <button class="btn btn-no" onclick="showVideo()">No</button>
        </div>
    </div>

    <!-- Video overlay para la respuesta "No" -->
    <div class="video-overlay" id="videoOverlay">
        <video id="noVideo" preload="none">
            <source src="video_no.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Video overlay para la respuesta "Sí" -->
    <div class="video-overlay" id="videoOverlayYes">
        <video id="yesVideo" preload="none">
            <source src="video_si.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Música de fondo local -->
    <audio id="bgMusic" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Fondo de palas ya está configurado con CSS SVG

        // Música de fondo
        const bgMusic = document.getElementById('bgMusic');
        const startOverlay = document.getElementById('startOverlay');
        bgMusic.volume = 0.7;

        // Asegurar que el video NO se reproduzca al cargar
        const noVideo = document.getElementById('noVideo');
        noVideo.pause();
        noVideo.currentTime = 0;

        // Al hacer clic en el overlay, iniciar música y ocultar overlay
        startOverlay.addEventListener('click', function() {
            // Pausar el video por si acaso
            noVideo.pause();
            noVideo.currentTime = 0;
            
            bgMusic.play().then(() => {
                console.log('Música iniciada');
            }).catch(e => {
                console.log('Error:', e);
            });
            startOverlay.classList.add('hidden');
        });

        // Función para ir a LinkedIn después del video
        function goToLinkedIn() {
            const overlay = document.getElementById('videoOverlayYes');
            const video = document.getElementById('yesVideo');
            
            // Pausar la música de fondo
            bgMusic.pause();
            
            overlay.classList.add('active');
            video.currentTime = 0;
            video.muted = false;
            video.volume = 1.0;
            
            // Forzar reproducción del video con audio
            video.play().then(() => {
                console.log('Video Sí reproduciendo con audio');
            }).catch(e => {
                console.log('Error video:', e);
                video.muted = true;
                video.play().then(() => {
                    setTimeout(() => {
                        video.muted = false;
                    }, 100);
                });
            });
            
            // Cuando termine el video, redirigir a LinkedIn
            video.onended = function() {
                // Redirigir a LinkedIn en la misma ventana
                window.location.href = 'https://www.linkedin.com';
            };
        }

        // Botón "No" que escapa
        const btnNo = document.querySelector('.btn-no');
        const btnYes = document.querySelector('.btn-yes');
        let escapeCount = 0;
        const maxEscapes = 10;

        function escapeButton() {
            if (escapeCount >= maxEscapes) return;
            
            escapeCount++;
            
            // Hacer el botón "Sí" más grande
            const currentSize = 1 + (escapeCount * 0.1);
            btnYes.style.transform = `scale(${currentSize})`;
            
            // Mover el botón "No" a una posición aleatoria
            btnNo.classList.add('escaping');
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            const randomX = Math.random() * maxX + 10;
            const randomY = Math.random() * maxY + 10;
            
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Escapar cuando el cursor se acerca
        btnNo.addEventListener('mouseenter', escapeButton);
        btnNo.addEventListener('click', function(e) {
            e.preventDefault();
            escapeButton();
        });
        
        // También escapar en dispositivos táctiles
        btnNo.addEventListener('touchstart', function(e) {
            e.preventDefault();
            escapeButton();
        });

        // Función para mostrar el video en pantalla completa
        function showVideo() {
            const overlay = document.getElementById('videoOverlay');
            const video = document.getElementById('noVideo');
            
            // Pausar la música de fondo
            bgMusic.pause();
            
            overlay.classList.add('active');
            video.currentTime = 0;
            video.muted = false;
            video.volume = 1.0;
            
            // Forzar reproducción del video con audio
            video.play().then(() => {
                console.log('Video reproduciendo con audio');
            }).catch(e => {
                console.log('Error video:', e);
                // Si falla, intentar con muted y luego desmutear
                video.muted = true;
                video.play().then(() => {
                    setTimeout(() => {
                        video.muted = false;
                    }, 100);
                });
            });
            
            // Cuando termine el video, cerrar la pestaña
            video.onended = function() {
                window.close();
                setTimeout(() => {
                    window.location.href = 'about:blank';
                }, 100);
            };
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('videoOverlay').classList.remove('active');
                const video = document.getElementById('noVideo');
                video.pause();
            }
        });
    </script>
</body>
</html>
