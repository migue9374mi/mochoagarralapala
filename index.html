<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocho Vago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a0a2e 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotating-image {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #ff0000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 80px rgba(255, 0, 0, 0.3);
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .text-overlay h1 {
            color: #ff0000;
            font-size: 2.5rem;
            text-shadow: 
                3px 3px 0 #8b0000,
                -1px -1px 0 #8b0000,
                1px -1px 0 #8b0000,
                -1px 1px 0 #8b0000,
                0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 2px;
            line-height: 1.3;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .circus-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .light {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 0.3;
                box-shadow: 0 0 10px currentColor;
            }
            to {
                opacity: 1;
                box-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
            }
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="circus-lights" id="lights"></div>
    
    <div class="container">
        <img src="WhatsApp Image 2026-09-30 at 10.36.58 AM.jpeg" alt="Imagen" class="rotating-image">
        <div class="text-overlay">
            <h1>Mocho vago,<br>agarra la pala</h1>
        </div>
    </div>

    <audio id="circusMusic" loop>
        <source src="https://upload.wikimedia.org/wikipedia/commons/transcoded/e/eb/Entry_of_the_Gladiators.ogg/Entry_of_the_Gladiators.ogg.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Crear luces de circo
        const lightsContainer = document.getElementById('lights');
        const colors = ['#ff0000', '#ffff00', '#00ff00', '#0000ff', '#ff00ff', '#00ffff'];
        
        for (let i = 0; i < 30; i++) {
            const light = document.createElement('div');
            light.className = 'light';
            light.style.left = Math.random() * 100 + '%';
            light.style.top = Math.random() * 100 + '%';
            light.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            light.style.color = colors[Math.floor(Math.random() * colors.length)];
            light.style.animationDelay = Math.random() * 2 + 's';
            lightsContainer.appendChild(light);
        }

        // Reproducir música de circo al hacer clic (requerido por navegadores)
        const music = document.getElementById('circusMusic');
        document.body.addEventListener('click', () => {
            if (music.paused) {
                music.play().catch(e => console.log('Audio bloqueado:', e));
            }
        }, { once: true });

        // Intentar reproducción automática
        music.play().catch(() => {
            console.log('Click para activar la música');
        });
    </script>
</body>
</html>
