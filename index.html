<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocho Vago</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        /* Fondo de palas */
        .shovel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            font-size: 60px;
            line-height: 1.5;
            word-spacing: 80px;
            color: #fff;
            white-space: pre-wrap;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            z-index: 10;
        }

        .rotating-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 3px solid #ff0000;
            animation: rotate 12s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .text-overlay h1 {
            color: #ff0000;
            font-size: 1.8rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .question-section {
            text-align: center;
            z-index: 10;
        }

        .question-section h2 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 25px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-yes {
            border-color: #00ff00;
            color: #00ff00;
        }

        .btn-yes:hover {
            background: #00ff00;
            color: #000;
        }

        .btn-no {
            border-color: #ff0000;
            color: #ff0000;
        }

        .btn-no:hover {
            background: #ff0000;
            color: #fff;
        }

        /* Video overlay */
        .video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
        }

        .video-overlay.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Fondo de palas -->
    <div class="shovel-bg" id="shovelBg"></div>
    
    <div class="container">
        <img src="imagen.jpeg" alt="Imagen" class="rotating-image">
        <div class="text-overlay">
            <h1>Mocho vago,<br>agarra la pala</h1>
        </div>
    </div>

    <div class="question-section">
        <h2>¿Quieres chamba?</h2>
        <div class="buttons">
            <button class="btn btn-yes" onclick="goToLinkedIn()">Sí</button>
            <button class="btn btn-no" onclick="showVideo()">No</button>
        </div>
    </div>

    <!-- Video overlay para la respuesta "No" -->
    <div class="video-overlay" id="videoOverlay">
        <video id="noVideo" autoplay>
            <source src="video_no.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Música de fondo local -->
    <audio id="bgMusic" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Crear fondo de palas
        const shovelBg = document.getElementById('shovelBg');
        const shovel = '🪏';
        let shovelText = '';
        for (let i = 0; i < 200; i++) {
            shovelText += shovel + ' ';
            if (i % 10 === 9) shovelText += '\n';
        }
        shovelBg.textContent = shovelText;

        // Música de fondo - reproducir lo antes posible
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.7;
        
        function tryPlay() {
            bgMusic.play().then(() => {
                document.removeEventListener('click', tryPlay);
                document.removeEventListener('keydown', tryPlay);
                document.removeEventListener('touchstart', tryPlay);
                document.removeEventListener('mousemove', tryPlay);
            }).catch(() => {});
        }
        
        tryPlay();
        document.addEventListener('click', tryPlay);
        document.addEventListener('keydown', tryPlay);
        document.addEventListener('touchstart', tryPlay);
        document.addEventListener('mousemove', tryPlay);

        // Función para ir a LinkedIn
        function goToLinkedIn() {
            window.open('https://www.linkedin.com', '_blank');
        }

        // Función para mostrar el video en pantalla completa
        function showVideo() {
            const overlay = document.getElementById('videoOverlay');
            const video = document.getElementById('noVideo');
            
            bgMusic.pause();
            
            overlay.classList.add('active');
            video.currentTime = 0;
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(e => console.log('Video bloqueado:', e));
            
            video.onended = function() {
                window.close();
                setTimeout(() => {
                    window.location.href = 'about:blank';
                }, 100);
            };
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('videoOverlay').classList.remove('active');
                const video = document.getElementById('noVideo');
                video.pause();
            }
        });
    </script>
</body>
</html>
